<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Kreislauf: Versprechen, Einlösung, Bestätigung, und zurück zum nächsten Versprechen. Ein Versprechen an einen Menschen kann dazwischen wandern." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    .dg {
      --dg-text: var(--d-text, #1E2A23);
      --dg-muted: var(--d-muted, #65716A);
      --dg-line: var(--d-line, #D6DDD7);
      --dg-surface: var(--d-surface, #FFFFFF);
      --dg-area: var(--d-area, #E9F0EA);
      --dg-accent: var(--d-accent, #3B6B46);
    }
    @media (prefers-color-scheme: dark) {
      .dg {
        --dg-text: var(--d-text, #E3E9E4);
        --dg-muted: var(--d-muted, #9BA79E);
        --dg-line: var(--d-line, #4A564D);
        --dg-surface: var(--d-surface, #1A221C);
        --dg-area: var(--d-area, #263529);
        --dg-accent: var(--d-accent, #7FB68C);
      }
    }
    .dg .fill-text { fill: var(--dg-text); }
    .dg .fill-muted { fill: var(--dg-muted); }
    .dg .fill-surface { fill: var(--dg-surface); }
    .dg .fill-area { fill: var(--dg-area); }
    .dg .fill-accent { fill: var(--dg-accent); }
    .dg .stroke-text { stroke: var(--dg-text); }
    .dg .stroke-muted { stroke: var(--dg-muted); }
    .dg .stroke-line { stroke: var(--dg-line); }
    .dg .stroke-accent { stroke: var(--dg-accent); }
  </style>
  <defs><marker id="arrow-cycle-de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fill-muted" d="M0 0L10 5L0 10z"/></marker></defs>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M470 96 L 548 220" marker-end="url(#arrow-cycle-de)"/>
    <path d="M470 258 H 252" marker-end="url(#arrow-cycle-de)"/>
    <path d="M172 220 L 250 96" marker-end="url(#arrow-cycle-de)"/>
    <path d="M477 60 H 730 V 258 H 702" stroke-dasharray="4 4" marker-end="url(#arrow-cycle-de)"/>
  </g>
  <g>
    <rect class="fill-surface stroke-line" x="245" y="24" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="360" y="50" text-anchor="middle" font-weight="600">Versprechen</text>
    <text class="fill-muted" x="360" y="69" text-anchor="middle" font-size="11.5">ich liefere dir das bis dann</text>
    <text class="fill-muted" x="360" y="84" text-anchor="middle" font-size="11.5">oder: ich mache das für uns</text>
    <rect class="fill-surface stroke-line" x="470" y="222" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="585" y="248" text-anchor="middle" font-weight="600">Einlösung</text>
    <text class="fill-muted" x="585" y="267" text-anchor="middle" font-size="11.5">liefern, wenn der Halter es verlangt</text>
    <text class="fill-muted" x="585" y="282" text-anchor="middle" font-size="11.5">oder: tun</text>
    <rect class="fill-surface stroke-line" x="20" y="222" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="135" y="248" text-anchor="middle" font-weight="600">Bestätigung</text>
    <text class="fill-muted" x="135" y="267" text-anchor="middle" font-size="11.5">vom Halter</text>
    <text class="fill-muted" x="135" y="282" text-anchor="middle" font-size="11.5">oder: von denen, die es sahen</text>
  </g>
  <text class="fill-text" x="360" y="150" text-anchor="middle" font-weight="600">Jedes gehaltene Versprechen</text>
  <text class="fill-text" x="360" y="168" text-anchor="middle" font-weight="600">wird ein Stück Vertrauen</text>
  <text class="fill-muted" x="24" y="150" font-size="11.5">macht das nächste Versprechen</text>
  <text class="fill-muted" x="24" y="166" font-size="11.5">leichter annehmbar</text>
  <text class="fill-muted" x="500" y="80" font-size="11.5">kann wandern: angenommen,</text>
  <text class="fill-muted" x="500" y="96" font-size="11.5">weitergegeben, verbürgt</text>
  <text class="fill-muted" x="360" y="340" text-anchor="middle" font-size="11.5">Nur ein liquides Versprechen kann wandern:</text>
  <text class="fill-muted" x="360" y="356" text-anchor="middle" font-size="11.5">jemand nimmt es an, weil er den Versprechenden kennt</text>
  <text class="fill-muted" x="360" y="372" text-anchor="middle" font-size="11.5">oder jemand für ihn bürgt, und gibt es weiter.</text>
</svg>
