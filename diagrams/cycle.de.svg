<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Kreislauf: Versprechen, Einlösung, Bestätigung, und zurück zum nächsten Versprechen. Ein Versprechen an einen Menschen kann dazwischen wandern." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
        <defs><marker id="k-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65716A"/></marker></defs>
        <g color="#65716A" fill="none" stroke="#65716A" stroke-width="1.25">
          <path d="M470 96 L 548 220" marker-end="url(#k-arrow)"/>
          <path d="M470 258 H 252" marker-end="url(#k-arrow)"/>
          <path d="M172 220 L 250 96" marker-end="url(#k-arrow)"/>
          <path d="M477 60 H 730 V 258 H 702" stroke-dasharray="4 4" marker-end="url(#k-arrow)"/>
        </g>
        <g>
          <rect x="245" y="24" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="360" y="50" text-anchor="middle" font-weight="600" fill="#1E2A23">Versprechen</text>
          <text x="360" y="69" text-anchor="middle" font-size="11.5" fill="#65716A">ich liefere dir das bis dann</text>
          <text x="360" y="84" text-anchor="middle" font-size="11.5" fill="#65716A">oder: ich mache das für uns</text>
          <rect x="470" y="222" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="585" y="248" text-anchor="middle" font-weight="600" fill="#1E2A23">Einlösung</text>
          <text x="585" y="267" text-anchor="middle" font-size="11.5" fill="#65716A">liefern, wenn der Halter es verlangt</text>
          <text x="585" y="282" text-anchor="middle" font-size="11.5" fill="#65716A">oder: tun</text>
          <rect x="20" y="222" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="135" y="248" text-anchor="middle" font-weight="600" fill="#1E2A23">Bestätigung</text>
          <text x="135" y="267" text-anchor="middle" font-size="11.5" fill="#65716A">vom Halter</text>
          <text x="135" y="282" text-anchor="middle" font-size="11.5" fill="#65716A">oder: von denen, die es sahen</text>
        </g>
        <text x="360" y="150" text-anchor="middle" font-weight="600" fill="#1E2A23">Jedes gehaltene Versprechen</text>
        <text x="360" y="168" text-anchor="middle" font-weight="600" fill="#1E2A23">wird ein Stück Vertrauen</text>
        <text x="24" y="150" font-size="11.5" fill="#65716A">macht das nächste Versprechen</text>
        <text x="24" y="166" font-size="11.5" fill="#65716A">leichter annehmbar</text>
        <text x="500" y="80" font-size="11.5" fill="#65716A">kann wandern: angenommen,</text>
        <text x="500" y="96" font-size="11.5" fill="#65716A">weitergegeben, verbürgt</text>
        <text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#65716A">Nur ein liquides Versprechen kann wandern:</text>
        <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#65716A">jemand nimmt es an, weil er den Versprechenden kennt</text>
        <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#65716A">oder jemand für ihn bürgt, und gibt es weiter.</text>
      </svg>
