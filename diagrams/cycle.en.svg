<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Cycle: promise, redemption, confirmation, and back to the next promise. A promise to a person can travel in between." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    .dg {
      --dg-text: var(--d-text, #1E2A23);
      --dg-muted: var(--d-muted, #65716A);
      --dg-line: var(--d-line, #D6DDD7);
      --dg-surface: var(--d-surface, #FFFFFF);
      --dg-area: var(--d-area, #E9F0EA);
      --dg-accent: var(--d-accent, #3B6B46);
    }
    @media (prefers-color-scheme: dark) {
      .dg {
        --dg-text: var(--d-text, #E3E9E4);
        --dg-muted: var(--d-muted, #9BA79E);
        --dg-line: var(--d-line, #4A564D);
        --dg-surface: var(--d-surface, #1A221C);
        --dg-area: var(--d-area, #263529);
        --dg-accent: var(--d-accent, #7FB68C);
      }
    }
    .dg .fill-text { fill: var(--dg-text); }
    .dg .fill-muted { fill: var(--dg-muted); }
    .dg .fill-surface { fill: var(--dg-surface); }
    .dg .fill-area { fill: var(--dg-area); }
    .dg .fill-accent { fill: var(--dg-accent); }
    .dg .stroke-text { stroke: var(--dg-text); }
    .dg .stroke-muted { stroke: var(--dg-muted); }
    .dg .stroke-line { stroke: var(--dg-line); }
    .dg .stroke-accent { stroke: var(--dg-accent); }
  </style>
  <defs><marker id="arrow-cycle-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fill-muted" d="M0 0L10 5L0 10z"/></marker></defs>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M470 96 L 548 220" marker-end="url(#arrow-cycle-en)"/>
    <path d="M470 258 H 252" marker-end="url(#arrow-cycle-en)"/>
    <path d="M172 220 L 250 96" marker-end="url(#arrow-cycle-en)"/>
    <path d="M477 60 H 730 V 258 H 702" stroke-dasharray="4 4" marker-end="url(#arrow-cycle-en)"/>
  </g>
  <g>
    <rect class="fill-surface stroke-line" x="245" y="24" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="360" y="50" text-anchor="middle" font-weight="600">Promise</text>
    <text class="fill-muted" x="360" y="69" text-anchor="middle" font-size="11.5">I will deliver this to you by then</text>
    <text class="fill-muted" x="360" y="84" text-anchor="middle" font-size="11.5">or: I will do this for us</text>
    <rect class="fill-surface stroke-line" x="470" y="222" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="585" y="248" text-anchor="middle" font-weight="600">Redemption</text>
    <text class="fill-muted" x="585" y="267" text-anchor="middle" font-size="11.5">deliver when the holder asks</text>
    <text class="fill-muted" x="585" y="282" text-anchor="middle" font-size="11.5">or: do it</text>
    <rect class="fill-surface stroke-line" x="20" y="222" width="230" height="72" rx="8" stroke-width="1.25"/>
    <text class="fill-text" x="135" y="248" text-anchor="middle" font-weight="600">Confirmation</text>
    <text class="fill-muted" x="135" y="267" text-anchor="middle" font-size="11.5">by the holder</text>
    <text class="fill-muted" x="135" y="282" text-anchor="middle" font-size="11.5">or: by those who saw it</text>
  </g>
  <text class="fill-text" x="360" y="150" text-anchor="middle" font-weight="600">Every promise kept</text>
  <text class="fill-text" x="360" y="168" text-anchor="middle" font-weight="600">becomes a piece of trust</text>
  <text class="fill-muted" x="24" y="150" font-size="11.5">makes the next promise</text>
  <text class="fill-muted" x="24" y="166" font-size="11.5">easier to accept</text>
  <text class="fill-muted" x="500" y="80" font-size="11.5">can travel: accepted,</text>
  <text class="fill-muted" x="500" y="96" font-size="11.5">passed on, vouched for</text>
  <text class="fill-muted" x="360" y="340" text-anchor="middle" font-size="11.5">Only a liquid promise can travel:</text>
  <text class="fill-muted" x="360" y="356" text-anchor="middle" font-size="11.5">someone accepts it because they know the promiser</text>
  <text class="fill-muted" x="360" y="372" text-anchor="middle" font-size="11.5">or someone vouches for them, and passes it on.</text>
</svg>
