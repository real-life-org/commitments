<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Cycle: promise, redemption, confirmation, and back to the next promise. A promise to a person can travel in between." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
        <defs><marker id="k-arrow-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65716A"/></marker></defs>
        <g color="#65716A" fill="none" stroke="#65716A" stroke-width="1.25">
          <path d="M470 96 L 548 220" marker-end="url(#k-arrow-en)"/>
          <path d="M470 258 H 252" marker-end="url(#k-arrow-en)"/>
          <path d="M172 220 L 250 96" marker-end="url(#k-arrow-en)"/>
          <path d="M477 60 H 730 V 258 H 702" stroke-dasharray="4 4" marker-end="url(#k-arrow-en)"/>
        </g>
        <g>
          <rect x="245" y="24" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="360" y="50" text-anchor="middle" font-weight="600" fill="#1E2A23">Promise</text>
          <text x="360" y="69" text-anchor="middle" font-size="11.5" fill="#65716A">I will deliver this to you by then</text>
          <text x="360" y="84" text-anchor="middle" font-size="11.5" fill="#65716A">or: I will do this for us</text>
          <rect x="470" y="222" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="585" y="248" text-anchor="middle" font-weight="600" fill="#1E2A23">Redemption</text>
          <text x="585" y="267" text-anchor="middle" font-size="11.5" fill="#65716A">deliver when the holder asks</text>
          <text x="585" y="282" text-anchor="middle" font-size="11.5" fill="#65716A">or: do it</text>
          <rect x="20" y="222" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#D6DDD7" stroke-width="1.25"/>
          <text x="135" y="248" text-anchor="middle" font-weight="600" fill="#1E2A23">Confirmation</text>
          <text x="135" y="267" text-anchor="middle" font-size="11.5" fill="#65716A">by the holder</text>
          <text x="135" y="282" text-anchor="middle" font-size="11.5" fill="#65716A">or: by those who saw it</text>
        </g>
        <text x="360" y="150" text-anchor="middle" font-weight="600" fill="#1E2A23">Every promise kept</text>
        <text x="360" y="168" text-anchor="middle" font-weight="600" fill="#1E2A23">becomes a piece of trust</text>
        <text x="24" y="150" font-size="11.5" fill="#65716A">makes the next promise</text>
        <text x="24" y="166" font-size="11.5" fill="#65716A">easier to accept</text>
        <text x="500" y="80" font-size="11.5" fill="#65716A">can travel: accepted,</text>
        <text x="500" y="96" font-size="11.5" fill="#65716A">passed on, vouched for</text>
        <text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#65716A">Only a liquid promise can travel:</text>
        <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#65716A">someone accepts it because they know the promiser</text>
        <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#65716A">or someone vouches for them, and passes it on.</text>
      </svg>
