<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Reichweite eines Versprechens: unter dem Community-Anker erreicht es Carla über Bens Bürgschaft, unter dem paarweisen Anker endet es bei Ben" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    .dg {
      --dg-text: var(--d-text, #1E2A23);
      --dg-muted: var(--d-muted, #65716A);
      --dg-line: var(--d-line, #D6DDD7);
      --dg-surface: var(--d-surface, #FFFFFF);
      --dg-area: var(--d-area, #E9F0EA);
      --dg-accent: var(--d-accent, #3B6B46);
    }
    @media (prefers-color-scheme: dark) {
      .dg {
        --dg-text: var(--d-text, #E3E9E4);
        --dg-muted: var(--d-muted, #9BA79E);
        --dg-line: var(--d-line, #4A564D);
        --dg-surface: var(--d-surface, #1A221C);
        --dg-area: var(--d-area, #1F2B22);
        --dg-accent: var(--d-accent, #7FB68C);
      }
    }
    .dg .fill-text { fill: var(--dg-text); }
    .dg .fill-muted { fill: var(--dg-muted); }
    .dg .fill-surface { fill: var(--dg-surface); }
    .dg .fill-area { fill: var(--dg-area); }
    .dg .fill-accent { fill: var(--dg-accent); }
    .dg .stroke-text { stroke: var(--dg-text); }
    .dg .stroke-muted { stroke: var(--dg-muted); }
    .dg .stroke-line { stroke: var(--dg-line); }
    .dg .stroke-accent { stroke: var(--dg-accent); }
  </style>
  <defs><marker id="arrow-reach-de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fill-muted" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="fill-text" x="20" y="24" font-weight="600">Unter dem Community-Anker</text>
  <ellipse class="fill-area stroke-line" cx="150" cy="180" rx="118" ry="92"/>
  <text class="fill-muted" x="62" y="110" font-size="11.5">Annas Vertrauen</text>
  <text class="fill-muted" x="62" y="124" font-size="11.5">wem sie ihren Anker gezeigt hat</text>
  <ellipse class="fill-accent stroke-accent" cx="272" cy="150" rx="98" ry="76" fill-opacity="0.08" stroke-dasharray="4 4"/>
  <text class="fill-accent" x="236" y="248" font-size="11.5">Bens Bürgschaft</text>
  <text class="fill-accent" x="236" y="262" font-size="11.5">er nimmt Annas Versprechen an</text>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M130 180 H 208" marker-end="url(#arrow-reach-de)"/>
    <path d="M232 174 L 318 128" marker-end="url(#arrow-reach-de)"/>
  </g>
  <text class="fill-muted" x="168" y="172" text-anchor="middle" font-size="11.5">Versprechen</text>
  <circle class="fill-text" cx="120" cy="180" r="7"/><text class="fill-text" x="120" y="202" text-anchor="middle" font-weight="600">Anna</text><circle class="fill-text" cx="222" cy="180" r="7"/><text class="fill-text" x="222" y="202" text-anchor="middle" font-weight="600">Ben</text><circle class="fill-text" cx="330" cy="120" r="7"/><text class="fill-text" x="330" y="142" text-anchor="middle" font-weight="600">Carla</text>
  <line class="stroke-line" x1="390" y1="20" x2="390" y2="300"/>
  <text class="fill-text" x="410" y="24" font-weight="600">Unter dem paarweisen Anker</text>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M520 180 H 598" marker-end="url(#arrow-reach-de)"/>
    <path d="M622 174 L 700 128" stroke-dasharray="3 4" marker-end="url(#arrow-reach-de)"/>
  </g>
  <text class="fill-muted" x="558" y="172" text-anchor="middle" font-size="11.5">Versprechen</text>
  <circle class="fill-text" cx="510" cy="180" r="7"/><text class="fill-text" x="510" y="202" text-anchor="middle" font-weight="600">Anna</text><circle class="fill-text" cx="612" cy="180" r="7"/><text class="fill-text" x="612" y="202" text-anchor="middle" font-weight="600">Ben</text>
  <rect class="stroke-line" x="676" y="92" width="68" height="56" rx="8" fill="none" stroke-dasharray="3 3"/>
  <text class="fill-muted" x="710" y="116" text-anchor="middle" font-size="16">?</text>
  <text class="fill-muted" x="710" y="134" text-anchor="middle" font-size="10.5">Carla</text>
  <text class="fill-muted" x="710" y="166" text-anchor="middle" font-size="11.5">nicht zuzuordnen</text>
</svg>
