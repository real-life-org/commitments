  <rect class="fill-surface stroke-text" x="186" y="137" width="76" height="26" rx="6"/><text class="fill-text" x="224" y="154" text-anchor="middle" font-size="11" font-weight="600">50 Brote</text>
  <rect class="fill-surface stroke-text" x="406" y="137" width="76" height="26" rx="6"/><text class="fill-text" x="444" y="154" text-anchor="middle" font-size="11" font-weight="600">50 Brote</text>
  <text class="fill-muted" x="451" y="230" text-anchor="middle" font-size="11.5">Ben nimmt es ab, wenn Carla es nicht braucht</text>
