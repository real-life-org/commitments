<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Circles tauscht entlang des Pfades, hier wandert dasselbe Versprechen und Ben nimmt es zurück" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    .dg {
      --dg-text: var(--d-text, #1E2A23);
      --dg-muted: var(--d-muted, #65716A);
      --dg-line: var(--d-line, #D6DDD7);
      --dg-surface: var(--d-surface, #FFFFFF);
      --dg-area: var(--d-area, #E9F0EA);
      --dg-accent: var(--d-accent, #3B6B46);
    }
    @media (prefers-color-scheme: dark) {
      .dg {
        --dg-text: var(--d-text, #E3E9E4);
        --dg-muted: var(--d-muted, #9BA79E);
        --dg-line: var(--d-line, #4A564D);
        --dg-surface: var(--d-surface, #1A221C);
        --dg-area: var(--d-area, #263529);
        --dg-accent: var(--d-accent, #7FB68C);
      }
    }
    .dg .fill-text { fill: var(--dg-text); }
    .dg .fill-muted { fill: var(--dg-muted); }
    .dg .fill-surface { fill: var(--dg-surface); }
    .dg .fill-area { fill: var(--dg-area); }
    .dg .fill-accent { fill: var(--dg-accent); }
    .dg .stroke-text { stroke: var(--dg-text); }
    .dg .stroke-muted { stroke: var(--dg-muted); }
    .dg .stroke-line { stroke: var(--dg-line); }
    .dg .stroke-accent { stroke: var(--dg-accent); }
  </style>
  <defs><marker id="arrow-circles-vs-ours-de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fill-muted" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="fill-text" x="20" y="54" font-weight="600">Circles</text>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M130 50 H 318" marker-end="url(#arrow-circles-vs-ours-de)"/><path d="M350 50 H 538" marker-end="url(#arrow-circles-vs-ours-de)"/>
  </g>
  <circle class="fill-text" cx="120" cy="50" r="7"/><text class="fill-text" x="120" y="72" text-anchor="middle" font-weight="600">Anna</text><circle class="fill-text" cx="340" cy="50" r="7"/><text class="fill-text" x="340" y="72" text-anchor="middle" font-weight="600">Ben</text><circle class="fill-text" cx="560" cy="50" r="7"/><text class="fill-text" x="560" y="72" text-anchor="middle" font-weight="600">Carla</text>
  <circle class="fill-surface stroke-text" cx="224" cy="50" r="13"/><text class="fill-text" x="224" y="54" text-anchor="middle" font-size="11" font-weight="600">A</text><text class="fill-muted" x="224" y="28" text-anchor="middle" font-size="11.5">A-Einheiten</text>
  <circle class="fill-surface stroke-text" cx="444" cy="50" r="13"/><text class="fill-text" x="444" y="54" text-anchor="middle" font-size="11" font-weight="600">B</text><text class="fill-muted" x="444" y="28" text-anchor="middle" font-size="11.5">B-Einheiten</text>
  <line class="stroke-line" x1="20" y1="100" x2="740" y2="100"/>
  <text class="fill-text" x="20" y="154" font-weight="600">Hier</text>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M130 150 H 318" marker-end="url(#arrow-circles-vs-ours-de)"/><path d="M350 150 H 538" marker-end="url(#arrow-circles-vs-ours-de)"/>
    <path d="M556 180 Q 450 230 346 180" stroke-dasharray="4 4" marker-end="url(#arrow-circles-vs-ours-de)"/>
