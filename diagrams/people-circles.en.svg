<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="People as dots, circles as areas. Liquid promises travel between people, also beyond circles. Purpose-bound promises hang inside a circle. A person in two circles connects them." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    .dg {
      --dg-text: var(--d-text, #1E2A23);
      --dg-muted: var(--d-muted, #65716A);
      --dg-line: var(--d-line, #D6DDD7);
      --dg-surface: var(--d-surface, #FFFFFF);
      --dg-area: var(--d-area, #E9F0EA);
      --dg-accent: var(--d-accent, #3B6B46);
    }
    @media (prefers-color-scheme: dark) {
      .dg {
        --dg-text: var(--d-text, #E3E9E4);
        --dg-muted: var(--d-muted, #9BA79E);
        --dg-line: var(--d-line, #4A564D);
        --dg-surface: var(--d-surface, #1A221C);
        --dg-area: var(--d-area, #1F2B22);
        --dg-accent: var(--d-accent, #7FB68C);
      }
    }
    .dg .fill-text { fill: var(--dg-text); }
    .dg .fill-muted { fill: var(--dg-muted); }
    .dg .fill-surface { fill: var(--dg-surface); }
    .dg .fill-area { fill: var(--dg-area); }
    .dg .fill-accent { fill: var(--dg-accent); }
    .dg .stroke-text { stroke: var(--dg-text); }
    .dg .stroke-muted { stroke: var(--dg-muted); }
    .dg .stroke-line { stroke: var(--dg-line); }
    .dg .stroke-accent { stroke: var(--dg-accent); }
  </style>
  <defs><marker id="arrow-people-circles-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fill-muted" d="M0 0L10 5L0 10z"/></marker></defs>
  <ellipse class="fill-area stroke-line" cx="250" cy="190" rx="210" ry="130"/>
  <ellipse class="fill-area stroke-line" cx="560" cy="200" rx="165" ry="120"/>
  <text class="fill-muted" x="90" y="86" font-weight="600">Circle 1</text>
  <text class="fill-muted" x="640" y="104" font-weight="600">Circle 2</text>
  <g class="stroke-muted" fill="none" stroke-width="1.25">
    <path d="M152 170 L 288 246" marker-end="url(#arrow-people-circles-en)"/>
    <path d="M226 128 L 160 156" marker-end="url(#arrow-people-circles-en)"/>
    <path d="M312 250 L 420 212" marker-end="url(#arrow-people-circles-en)"/>
    <path d="M444 204 L 606 164" marker-end="url(#arrow-people-circles-en)"/>
    <path d="M630 156 L 690 82" marker-end="url(#arrow-people-circles-en)"/>
    <path d="M620 176 L 600 262" marker-end="url(#arrow-people-circles-en)"/>
  </g>
  <circle class="fill-text" cx="142" cy="165" r="7"/><circle class="fill-text" cx="236" cy="122" r="7"/><circle class="fill-text" cx="300" cy="254" r="7"/><circle class="fill-text" cx="432" cy="208" r="7"/><circle class="fill-text" cx="618" cy="160" r="7"/><circle class="fill-text" cx="596" cy="280" r="7"/><circle class="fill-text" cx="698" cy="70" r="7"/>
  <text class="fill-muted" x="432" y="236" text-anchor="middle" font-size="11.5">in both circles</text>
  <text class="fill-muted" x="698" y="52" text-anchor="middle" font-size="11.5">in no circle</text>
  <rect class="fill-surface stroke-accent" x="100" y="250" width="140" height="30" rx="4"/><text class="fill-text" x="170" y="269" text-anchor="middle" font-size="11">I will do this for us</text><rect class="fill-surface stroke-accent" x="470" y="300" width="140" height="30" rx="4"/><text class="fill-text" x="540" y="319" text-anchor="middle" font-size="11">I will do this for us</text>
  <g transform="translate(20,350)">
    <line class="stroke-muted" x1="0" y1="0" x2="28" y2="0" stroke-width="1.25" marker-end="url(#arrow-people-circles-en)"/>
    <text class="fill-muted" x="36" y="4" font-size="11.5">liquid promise, travels between people</text>
    <rect class="fill-surface stroke-accent" x="0" y="18" width="28" height="12" rx="3"/>
    <text class="fill-muted" x="36" y="28" font-size="11.5">purpose-bound promise, hangs in the circle</text>
    <ellipse class="fill-area stroke-line" cx="14" cy="46" rx="14" ry="7"/>
    <text class="fill-muted" x="36" y="50" font-size="11.5">no arrow ever starts from an area</text>
  </g>
</svg>
