<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="People as dots, circles as areas. Liquid promises travel between people, also beyond circles. Purpose-bound promises hang inside a circle. A person in two circles connects them." font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13">
        <defs><marker id="f3-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65716A"/></marker></defs>
        <ellipse cx="250" cy="190" rx="210" ry="130" fill="#E9F0EA" stroke="#D6DDD7"/>
        <ellipse cx="560" cy="200" rx="165" ry="120" fill="#E9F0EA" stroke="#D6DDD7"/>
        <text x="90" y="86" font-weight="600" fill="#65716A">Circle 1</text>
        <text x="640" y="104" font-weight="600" fill="#65716A">Circle 2</text>
        <g color="#65716A" fill="none" stroke="#65716A" stroke-width="1.25">
          <path d="M152 170 L 288 246" marker-end="url(#f3-en)"/>
          <path d="M226 128 L 160 156" marker-end="url(#f3-en)"/>
          <path d="M312 250 L 420 212" marker-end="url(#f3-en)"/>
          <path d="M444 204 L 606 164" marker-end="url(#f3-en)"/>
          <path d="M630 156 L 690 82" marker-end="url(#f3-en)"/>
          <path d="M620 176 L 600 262" marker-end="url(#f3-en)"/>
        </g>
        <circle cx="142" cy="165" r="7" fill="#1E2A23"/><circle cx="236" cy="122" r="7" fill="#1E2A23"/><circle cx="300" cy="254" r="7" fill="#1E2A23"/><circle cx="432" cy="208" r="7" fill="#1E2A23"/><circle cx="618" cy="160" r="7" fill="#1E2A23"/><circle cx="596" cy="280" r="7" fill="#1E2A23"/><circle cx="698" cy="70" r="7" fill="#1E2A23"/>
        <text x="432" y="236" text-anchor="middle" font-size="11.5" fill="#65716A">in both circles</text>
        <text x="698" y="52" text-anchor="middle" font-size="11.5" fill="#65716A">in no circle</text>
        <rect x="100" y="250" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#3B6B46"/><text x="170" y="269" text-anchor="middle" font-size="11" fill="#1E2A23">I will do this for us</text><rect x="470" y="300" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#3B6B46"/><text x="540" y="319" text-anchor="middle" font-size="11" fill="#1E2A23">I will do this for us</text>
        <g transform="translate(20,350)">
          <line x1="0" y1="0" x2="28" y2="0" stroke="#65716A" stroke-width="1.25" marker-end="url(#f3-en)" color="#65716A"/>
          <text x="36" y="4" font-size="11.5" fill="#65716A">liquid promise, travels between people</text>
          <rect x="0" y="18" width="28" height="12" rx="3" fill="#FFFFFF" stroke="#3B6B46"/>
          <text x="36" y="28" font-size="11.5" fill="#65716A">purpose-bound promise, hangs in the circle</text>
          <ellipse cx="14" cy="46" rx="14" ry="7" fill="#E9F0EA" stroke="#D6DDD7"/>
          <text x="36" y="50" font-size="11.5" fill="#65716A">no arrow ever starts from an area</text>
        </g>
      </svg>
